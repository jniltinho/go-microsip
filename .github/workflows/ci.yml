# Checks on main and on pull requests. Everything Go and Node runs inside the pinned build image
# (build/linux.Dockerfile); the runner needs only Docker and make, and no secrets.
# The artifacts this workflow builds from a commit on main are the ones release.yml publishes for
# a tag on that commit: they are not built a second time.
# Not covered here (see docs/release.md): the lab PBX, the desktop VMs and calls with real sound.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    name: Publication scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: the publication scan checks every reachable blob.
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked content
        run: sh build/release/scan-publication.sh
      - name: Scanner negative controls
        run: sh build/release/ci-selftest.sh
      - name: Release gate check controls
        run: sh build/release/check-gates-selftest.sh
      # The check of the macOS build over SSH says nothing of the Mac it runs on (stand-ins for ssh).
      - name: Mac check controls
        run: sh build/vm/mac-selftest.sh
      # The notes of the version in the tree, as release.yml would publish them.
      - name: Release notes
        run: sh build/release/notes.sh "$(sed -n 's/^GO_VERSION ?= //p' build/go.mk)" "$GITHUB_REPOSITORY" > /dev/null

  build:
    name: Checks, tests and artifacts (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: the publication scan checks every reachable blob.
          fetch-depth: 0
          persist-credentials: false
      - name: Build image
        run: make image
      # gofmt, and go vet for the CGO-free, cgo, no-window and Windows builds.
      - name: Static checks
        run: make check
      # Includes the layering rules (internal/archtest).
      - name: Unit tests with the race detector
        run: make test
      - name: Frontend checks and tests
        run: make go-frontend-test
      - name: Artifacts
        run: make dist
      - name: Checksums and manifest
        run: |
          cd dist/go
          sha256sum --check --strict SHA256SUMS
          jq -e --arg c "$(git rev-parse --short=12 HEAD)" '.commit == $c and .dirty == false' build-manifest.json
      # WebKit's own sandbox (bubblewrap) needs user namespaces, which the runner's AppArmor denies
      # to unprivileged processes by default.
      - name: Allow user namespaces for the window check
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Headless checks and the window's self-test on the built files
        run: make go-smoke
      - name: Scan artifacts
        run: |
          command -v unsquashfs || { sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools; }
          mkdir publish
          cp dist/go/go-microsip-*-linux-amd64 dist/go/go-microsip-*-x86_64.AppImage \
            dist/go/go-microsip-*-windows-amd64.exe dist/go/go-microsip-*-windows-amd64.zip \
            dist/go/THIRD_PARTY_NOTICES.txt dist/go/sbom.cdx.json dist/go/SHA256SUMS \
            dist/go/build-manifest.json publish/
          sh build/release/scan-publication.sh publish
      # What release.yml publishes for a tag on this commit, and what the Windows job below runs.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: publish/
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows smoke (the built .exe and .zip)
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Checksums
        shell: pwsh
        run: |
          Set-Location dist
          foreach ($line in Get-Content SHA256SUMS) {
            $hash, $file = $line -split '\s+', 2
            $actual = (Get-FileHash -Algorithm SHA256 $file.TrimStart('*')).Hash.ToLower()
            if ($actual -ne $hash) { throw "checksum mismatch: $file" }
          }
      - name: Version, doctor and the .zip's contents
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = (Get-ChildItem dist -Filter 'go-microsip-*-windows-amd64.exe').FullName
          cmd /c "`"$exe`" version > version.txt 2>&1"
          if ($LASTEXITCODE -ne 0) { throw "version exited $LASTEXITCODE" }
          $version = (Get-Content version.txt) -join ' '
          if ($version -notmatch '^go-microsip ') { throw "unexpected version: $version" }
          Write-Host $version
          cmd /c "`"$exe`" doctor --json > doctor.txt 2>&1"
          if ($LASTEXITCODE -ne 0) { Get-Content doctor.txt; throw "doctor exited $LASTEXITCODE" }
          Expand-Archive (Get-ChildItem dist -Filter 'go-microsip-*-windows-amd64.zip').FullName zip
          $inside = @(Get-ChildItem zip -Recurse -File)
          $names = ($inside | ForEach-Object Name | Sort-Object) -join ', '
          if ($names -ne 'go-microsip.exe, LICENSE.txt, THIRD_PARTY_NOTICES.txt') { throw "the .zip holds: $names" }
          $program = ($inside | Where-Object Name -eq 'go-microsip.exe').FullName
          cmd /c "`"$program`" version > zipversion.txt 2>&1"
          if (((Get-Content zipversion.txt) -join ' ') -ne $version) { throw 'the program in the .zip says another version' }
          exit 0
