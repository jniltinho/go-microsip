# The only workflow that publishes binaries: runs on version tags (v0.2.0,
# v0.2.0-rc.1). It publishes only a commit on main whose ci.yml push run is
# green, and a final version only when docs/release/vX.Y.Z.md checks every
# release gate. Pushing the tag is the decision to publish: nothing waits for
# an approval on GitHub.
# It builds nothing: it publishes the files that green run built from the
# tagged commit, so what was checked is what is released. -rc.N tags are
# published as pre-releases.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: the publication scan checks every reachable blob.
          fetch-depth: 0
          persist-credentials: false
      - name: Require a green CI run for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --branch main --event push --status success --json databaseId -q '.[0].databaseId')
          if [ -z "$run" ]; then
            echo "no successful ci.yml push run on main for $GITHUB_SHA; release only green main commits" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$GITHUB_SHA is not on main" >&2; exit 1; }
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Tag matches the version of the build
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          declared=$(sed -n 's/^GO_VERSION ?= //p' build/go.mk)
          if [ "$version" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match GO_VERSION $declared of build/go.mk" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Every release gate is checked (final versions)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if printf '%s' "$VERSION" | grep -qE -- '-rc\.[0-9]+$'; then
            echo "pre-release: gates are not required"; exit 0
          fi
          case "$VERSION" in *-*) echo "only -rc.N pre-releases are allowed" >&2; exit 1 ;; esac
          sh build/release/check-gates-selftest.sh
          sh build/release/check-gates.sh "$VERSION"
      - name: Fetch the artifacts CI built from this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.ci.outputs.run }}
        run: gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name dist --dir release
      - name: Check artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd release
          sha256sum --check --strict SHA256SUMS
          # The files are those of this version and this commit, built from a clean checkout.
          jq -e --arg v "$VERSION" --arg c "$(git rev-parse --short=12 "$GITHUB_SHA")" \
            '.version == $v and .commit == $c and .dirty == false' build-manifest.json
          # Every file is one the checksums name, and nothing else is published.
          ls | grep -v -x -e SHA256SUMS | sort > ../present
          awk '{ sub(/^\*/, "", $2); print $2 }' SHA256SUMS | sort > ../listed
          cmp ../present ../listed || { diff ../listed ../present; exit 1; }
          for f in "go-microsip-$VERSION-linux-amd64" "go-microsip-$VERSION-x86_64.AppImage" \
            "go-microsip-$VERSION-windows-amd64.exe" "go-microsip-$VERSION-windows-amd64.zip" \
            THIRD_PARTY_NOTICES.txt sbom.cdx.json build-manifest.json; do
            [ -s "$f" ] || { echo "missing $f" >&2; exit 1; }
          done
          cd ..
          command -v unsquashfs || { sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools; }
          sh build/release/scan-publication.sh release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=
          case "$VERSION" in *-rc.*) prerelease=--prerelease ;; esac
          # The notes of the tagged commit, with the checksums of the files published beside them.
          if [ -f "docs/release/v$VERSION.md" ]; then cat "docs/release/v$VERSION.md"; else echo "go-microsip $VERSION"; fi > notes.md
          { printf '\n## Checksums (SHA-256)\n\n```\n'; cat release/SHA256SUMS; printf '```\n'; } >> notes.md
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --notes-file notes.md \
            --title "go-microsip $VERSION" $prerelease
